<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<script>
  // Set theme before first paint to avoid a flash. Dark unless the visitor chose light.
  try {
    document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
  } catch (e) {
    document.documentElement.dataset.theme = "dark";
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Toggle light/dark">
  <svg class="icon-svg icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-svg icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<header class="site-header">
  <img class="profile-pic" id="profile-pic" src="assets/images/profile.svg" alt="Profile photo">
  <h1 id="site-name">Your Name</h1>
  <p id="site-tagline">Edit <code>content/profile.md</code> to change this header.</p>
  <div class="links" id="links"></div>
  <div class="topics-wrapper">
    <div class="topics" id="topics"></div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="experience">Experience</button>
  <button class="tab-btn" data-tab="projects">Projects</button>
  <button class="tab-btn" data-tab="education">Education</button>
  <button class="tab-btn" data-tab="articles">Articles</button>
  <button class="tab-btn" data-tab="fun-stuff">Fun Stuff</button>
</nav>

<main id="content-area">
  <article class="tab-panel active" id="panel-experience"></article>
  <article class="tab-panel" id="panel-projects"></article>
  <article class="tab-panel" id="panel-education"></article>
  <article class="tab-panel" id="panel-articles"></article>
  <article class="tab-panel" id="panel-fun-stuff"></article>
</main>

<footer class="site-footer">
  <p>Built by <code>claude</code> with &hearts; for Me </p>
</footer>

<script src="assets/js/marked.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
